name: Koshien Daily Update

on:
  schedule:
    - cron: '0 12 * * *'  # 21:00 JST = 12:00 UTC
  workflow_dispatch: {}   # 手動で「今すぐ実行」もできるようにしておく

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install playwright

      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Fetch results
        run: node scripts/fetch-results.mjs

      - name: Commit updated data (if changed)
        run: |
          git config user.name "koshien-bot"
          git config user.email "koshien-bot@users.noreply.github.com"
          git add data/matches.json
          git diff --cached --quiet || git commit -m "auto: update results $(date +'%Y-%m-%d %H:%M')"
          git push
